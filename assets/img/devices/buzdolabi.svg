<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" role="img" aria-labelledby="title desc">
  <title id="title">Buzdolabı illüstrasyonu</title>
  <desc id="desc">Turkuaz ve sarı tonlarında iki kapılı bir buzdolabı</desc>
  <defs>
    <linearGradient id="fridgeBody" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#17a2b8" />
      <stop offset="1" stop-color="#0c5460" />
    </linearGradient>
    <linearGradient id="fridgeDoor" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0f7a8a" />
      <stop offset="1" stop-color="#12c2d0" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="140" height="200" rx="12" fill="url(#fridgeBody)" stroke="#042c34" stroke-width="6" />
  <rect x="22" y="20" width="116" height="92" rx="8" fill="url(#fridgeDoor)" />
  <rect x="22" y="118" width="116" height="82" rx="8" fill="url(#fridgeDoor)" />
  <rect x="30" y="60" width="12" height="24" rx="4" fill="#f8f9fa" />
  <rect x="118" y="152" width="12" height="24" rx="4" fill="#f8f9fa" />
